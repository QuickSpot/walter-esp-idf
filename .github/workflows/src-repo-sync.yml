name: Sync src folder to walter-arduino

on:
  pull_request_target:
    types: [closed]
    branches:
      - main
    paths:
      - 'src/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-src:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true

      - name: Setup SSH key for deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SRC_REPO_SYNC_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout walter-arduino via SSH
        uses: actions/checkout@v4
        with:
          # QuickSpot's, or a fork's when the variable WALTER_ARDUINO_REPO names one.
          repository: ${{ vars.WALTER_ARDUINO_REPO || 'QuickSpot/walter-arduino' }}
          ssh-key: ${{ secrets.SRC_REPO_SYNC_KEY }}
          path: walter-arduino

      - name: Copy src folder from walter-esp-idf to walter-arduino
        run: |
          rm -rf walter-arduino/src
          cp -R src walter-arduino/src

      # The title comes in through the environment: pasted into the script, a title could run
      # commands with the deploy key.
      - name: Prepare commit info
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_LINK="${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}"

          COMMIT_MESSAGE="SYNC: src update from walter-esp-idf (${PR_LINK})"
          COMMIT_DESCRIPTION="PR title: \"${PR_TITLE}\", nr: ${PR_NUMBER}"

          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "COMMIT_DESCRIPTION=$COMMIT_DESCRIPTION" >> $GITHUB_ENV

      - name: Commit and push changes in walter-arduino
        run: |
          cd walter-arduino
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src
          
          if ! git diff --cached --quiet; then
            git commit -m "${COMMIT_MESSAGE}" -m "${COMMIT_DESCRIPTION}"
            git push origin main
          else
            echo "No changes to sync"
          fi